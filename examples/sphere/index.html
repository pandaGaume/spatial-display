<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spatial-display: a sphere into another world</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060c;
        font: 13px/1.4 system-ui, sans-serif;
        color: #cfe6ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        max-width: 340px;
        padding: 10px 12px;
        background: rgba(8, 14, 28, 0.78);
        border: 1px solid rgba(60, 150, 255, 0.45);
        border-radius: 6px;
      }
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="status"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
