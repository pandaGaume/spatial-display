<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spatial-display: portal</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060c;
        font: 13px/1.4 system-ui, sans-serif;
        color: #cfe6ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      form {
        position: absolute;
        top: 12px;
        left: 12px;
        display: grid;
        grid-template-columns: auto 140px;
        gap: 6px 10px;
        align-items: center;
        padding: 10px 12px;
        background: rgba(8, 14, 28, 0.78);
        border: 1px solid rgba(60, 150, 255, 0.45);
        border-radius: 6px;
      }
      form a {
        color: #6fb6ff;
      }
      #status {
        grid-column: 1 / -1;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <form id="controls" autocomplete="off">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="screen">screen</option>
        <option value="window">window</option>
      </select>
      <label for="opacity">Opacity</label>
      <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.9" />
      <label for="width">Width</label>
      <input id="width" type="range" min="0.4" max="3" step="0.01" value="1.6" />
      <label for="height">Height</label>
      <input id="height" type="range" min="0.3" max="2" step="0.01" value="0.9" />
      <label for="section">Frame</label>
      <input id="section" type="range" min="0" max="0.1" step="0.001" value="0.012" />
      <label for="glowSize">Glow size</label>
      <input id="glowSize" type="range" min="0" max="0.6" step="0.005" value="0.18" />
      <label for="glowIntensity">Glow intensity</label>
      <input id="glowIntensity" type="range" min="0" max="4" step="0.05" value="1.4" />
      <label for="glowColor">Glow color</label>
      <input id="glowColor" type="color" value="#1a8cff" />
      <label for="lineColor">Line color</label>
      <input id="lineColor" type="color" value="#ffffff" />
      <label for="worldDepth">World glow depth</label>
      <input id="worldDepth" type="range" min="0" max="2" step="0.01" value="0.36" />
      <label for="worldIntensity">World glow intensity</label>
      <input id="worldIntensity" type="range" min="0" max="3" step="0.05" value="1" />
      <label for="source">Shows</label>
      <select id="source">
        <option value="world">world</option>
        <option value="world-clear">world, see-through background</option>
        <option value="picture">picture with alpha</option>
        <option value="green">picture on green, keyed</option>
        <option value="none">nothing</option>
      </select>
      <label for="fit">Fit</label>
      <select id="fit">
        <option>stretch</option>
        <option>contain</option>
        <option>cover</option>
      </select>
      <label for="refresh">Refresh</label>
      <select id="refresh">
        <option value="frame">every frame</option>
        <option value="5">5 Hz</option>
        <option value="manual">manual</option>
      </select>
      <label for="breathe">Animate size</label>
      <input id="breathe" type="checkbox" />
      <span id="status"></span>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
