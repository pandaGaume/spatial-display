<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spatial-display: x-ray 360</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060c;
        font: 13px/1.4 system-ui, sans-serif;
        color: #cfe6ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      form {
        position: absolute;
        top: 12px;
        left: 12px;
        display: grid;
        grid-template-columns: auto 140px;
        gap: 6px 10px;
        align-items: center;
        padding: 10px 12px;
        background: rgba(8, 14, 28, 0.78);
        border: 1px solid rgba(60, 150, 255, 0.45);
        border-radius: 6px;
      }
      #status {
        grid-column: 1 / -1;
        opacity: 0.75;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <form id="controls" autocomplete="off">
      <label for="shape">Surface</label>
      <select id="shape">
        <option value="ring">ring</option>
        <option value="polygon">polygon, not flat</option>
        <option value="sphere">sphere</option>
      </select>
      <label for="scan">Move the surface</label>
      <input id="scan" type="checkbox" checked />
      <label for="y">Height</label>
      <input id="y" type="range" min="0.2" max="2.7" step="0.01" value="1.4" />
      <label for="size">Size</label>
      <input id="size" type="range" min="0.1" max="2.9" step="0.01" value="0.75" />
      <label for="radius">Distance</label>
      <input id="radius" type="range" min="0.6" max="1.8" step="0.01" value="0.85" />
      <label for="back">Back face</label>
      <input id="back" type="checkbox" checked />
      <label for="hidden">See hidden parts</label>
      <input id="hidden" type="checkbox" checked />
      <label for="hull">See the hull</label>
      <input id="hull" type="checkbox" checked />
      <label for="surroundings">See the surroundings</label>
      <input id="surroundings" type="checkbox" />
      <label for="background">Background</label>
      <input id="background" type="range" min="0" max="1" step="0.01" value="0.86" />
      <label for="opacity">Opacity</label>
      <input id="opacity" type="range" min="0" max="1" step="0.01" value="1" />
      <span id="status"></span>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
