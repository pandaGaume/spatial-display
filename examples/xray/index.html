<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spatial-display: x-ray</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060c;
        font: 13px/1.4 system-ui, sans-serif;
        color: #cfe6ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      form {
        position: absolute;
        top: 12px;
        left: 12px;
        display: grid;
        grid-template-columns: auto 140px;
        gap: 6px 10px;
        align-items: center;
        padding: 10px 12px;
        background: rgba(8, 14, 28, 0.78);
        border: 1px solid rgba(60, 150, 255, 0.45);
        border-radius: 6px;
      }
      #status {
        grid-column: 1 / -1;
        opacity: 0.75;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <form id="controls" autocomplete="off">
      <label for="sweep">Move the screen</label>
      <input id="sweep" type="checkbox" checked />
      <label for="x">Screen position</label>
      <input id="x" type="range" min="-2.6" max="2.6" step="0.01" value="0" />
      <label for="walk">Walk</label>
      <input id="walk" type="checkbox" checked />
      <label for="hidden">See hidden meshes</label>
      <input id="hidden" type="checkbox" checked />
      <label for="wire">Wireframe</label>
      <input id="wire" type="checkbox" checked />
      <label for="background">Background</label>
      <input id="background" type="range" min="0" max="1" step="0.01" value="0.82" />
      <span id="status"></span>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
